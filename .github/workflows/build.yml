name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Mobile-friendly: if you only uploaded SambhavOS.zip (no folders), unpack it here.
      - name: Locate project
        id: locate
        run: |
          if [ -f settings.gradle.kts ]; then
            dir="."
          elif [ -f SambhavOS.zip ]; then
            mkdir -p _src && unzip -q SambhavOS.zip -d _src
            dir="$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")"
          else
            echo "::error::No settings.gradle.kts and no SambhavOS.zip found in the repository root."
            exit 1
          fi
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          build-root-directory: ${{ steps.locate.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SambhavOS-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.locate.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
