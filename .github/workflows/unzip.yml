name: Unzip Uploaded Archives
on:
  push:
    paths:
      - '**.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and remove ZIP files
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read zipfile; do
            unzip -o "$zipfile" -d "$(dirname "$zipfile")"
            rm "$zipfile"
          done
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git reset -- '.github/workflows/*'
          git commit -m "Extract uploaded ZIP archive" || exit 0
          git push
